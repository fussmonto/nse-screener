name: Daily NSE Screener

on:
  schedule:
    # GitHub cron is in UTC and often starts 10-30 min late.
    # 02:30 UTC = 08:00 IST  ->  report + email land at roughly 08:20-08:40 IST.
    - cron: "30 2 * * 1-5"
  workflow_dispatch:          # "Run workflow" button for manual test runs

permissions:
  contents: write             # lets the job commit the refreshed dashboard

concurrency:
  group: daily-screener
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run offline logic tests
        run: |
          python tests/test_offline.py
          python tests/test_desk.py
          python tests/test_telegram.py
          python tests/test_radar.py

      - name: Run screener and send email
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "465"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional: a published Google Sheet CSV (columns Symbol, Name, Sector, Mode, My_Buy_Price) replaces watchlist.json
          GOOGLE_SHEET_CSV_URL: ${{ secrets.GOOGLE_SHEET_CSV_URL }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          # Manual runs always regenerate, even if no new trading day exists
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}
          # Optional: set these under Settings > Secrets and variables > Actions > Variables to size positions for you
          INTRADAY_CAPITAL: ${{ vars.INTRADAY_CAPITAL }}
          INTRADAY_RISK_PCT: ${{ vars.INTRADAY_RISK_PCT }}
          INTRADAY_LEVERAGE: ${{ vars.INTRADAY_LEVERAGE }}
          CNC_CAPITAL: ${{ vars.CNC_CAPITAL }}
          CNC_RISK_PCT: ${{ vars.CNC_RISK_PCT }}
          CNC_MAX_POSITION_PCT: ${{ vars.CNC_MAX_POSITION_PCT }}
        run: python screener.py

      - name: Commit dashboard and caches
        if: always()
        run: |
          git config user.name  "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add docs data
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Screener report $(TZ=Asia/Kolkata date +%F)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi
